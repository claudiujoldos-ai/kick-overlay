<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>LiveLayer</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }
  .card { position: absolute; inset: 14px; border-radius: 22px; overflow: hidden;
    background: radial-gradient(500px 260px at 50% -20%, rgba(83,252,24,.22), transparent 70%),
                radial-gradient(400px 220px at 110% 120%, rgba(0,229,255,.12), transparent 70%), #07080c;
    border: 1px solid rgba(83,252,24,.35); box-shadow: 0 10px 40px rgba(0,0,0,.6);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    animation: pop .45s cubic-bezier(.2,1.3,.4,1); }
  img { width: 96px; height: 96px; filter: drop-shadow(0 0 22px rgba(83,252,24,.55)); animation: float 2.4s ease-in-out infinite; }
  h1 { margin: 16px 0 2px; font-size: 34px; font-weight: 900; letter-spacing: 6px; }
  h1 span { color: #53fc18; text-shadow: 0 0 18px rgba(83,252,24,.6); }
  .tag { color: #8a94a3; font-size: 13px; letter-spacing: 2px; }
  .bar { width: 220px; height: 4px; border-radius: 4px; background: #161b23; margin-top: 26px; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #00e5ff, #53fc18);
    box-shadow: 0 0 12px #53fc18; animation: load 1.1s ease-in-out infinite; }
  .ver { position: absolute; bottom: 14px; color: #5d6673; font-size: 11px; letter-spacing: 1px; }
  @keyframes load { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
  @keyframes float { 50% { transform: translateY(-6px); } }
  @keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="card">
    <img src="build/icon.png" alt="">
    <h1>LIVE<span>LAYER</span></h1>
    <div class="tag">CHAT · ALERTE · OVERLAY PENTRU KICK</div>
    <div class="bar"><i></i></div>
    <div class="ver" id="ver"></div>
  </div>
<script>
  const v = new URLSearchParams(location.search).get('v');
  if (v) document.getElementById('ver').textContent = 'versiunea ' + v;
</script>
</body>
</html>
